name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          python3 -V
          dpkg-deb --version | head -1

      - name: Build and verify reproducibility
        run: |
          python3 build.py
          cp OpenMinis-Jailbreak_*.deb /tmp/first.deb
          python3 build.py
          cmp /tmp/first.deb OpenMinis-Jailbreak_*.deb
          echo "reproducible: identical bytes"

      - name: Tests (unprivileged)
        run: |
          python3 test_package.py
          python3 test_api.py

      - name: Allow the UID501 fixture to run from the workspace
        run: sudo chmod -R a+rX "$GITHUB_WORKSPACE"

      - name: Tests (privileged)
        run: |
          sudo python3 test_safety.py
          sudo python3 test_supervisor.py

      - name: Checksums
        run: |
          sha256sum OpenMinis-Jailbreak_*.deb | tee SHA256SUMS.ci
          cat SHA256SUMS.ci

      - uses: actions/upload-artifact@v4
        with:
          name: openminis-jailbreak-deb
          path: |
            OpenMinis-Jailbreak_*.deb
            SHA256SUMS.ci

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 build.py
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME" --notes "Built from ${GITHUB_SHA}"
          gh release upload "$GITHUB_REF_NAME" OpenMinis-Jailbreak_*.deb --clobber
