name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          python3 -V
          dpkg-deb --version | head -1

      - name: Build and verify reproducibility
        run: |
          python3 build.py
          cp OpenMinis-Jailbreak_*.deb /tmp/first.deb
          python3 build.py
          cmp /tmp/first.deb OpenMinis-Jailbreak_*.deb
          echo "reproducible: identical bytes"

      - name: Source archive
        run: |
          V=$(python3 -c "import package_lifecycle as l; print(l.VERSION)")
          python3 source_archive.py
          ls -l OpenMinis-Jailbreak_*.deb "OpenMinis-Jailbreak_${V}-source.tar.gz"

      - name: Checksums
        run: |
          V=$(python3 -c "import package_lifecycle as l; print(l.VERSION)")
          sha256sum OpenMinis-Jailbreak_*.deb "OpenMinis-Jailbreak_${V}-source.tar.gz" \
            | tee SHA256SUMS

      - name: Tests (unprivileged)
        run: |
          python3 test_package.py
          python3 test_api.py
          python3 test_filetools.py

      - name: Allow the UID501 fixture to run from the workspace
        run: sudo chmod -R a+rX "$GITHUB_WORKSPACE"

      - name: Tests (privileged)
        run: |
          rc=0
          sudo -E python3 test_safety.py || rc=1
          sudo -E python3 test_supervisor.py || rc=1
          sudo -E python3 test_upgrade.py || rc=1
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            OpenMinis-Jailbreak_*.deb
            OpenMinis-Jailbreak_*-source.tar.gz
            SHA256SUMS

  tests-python39:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: python:3.9-slim-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dpkg
          python3 -V
      - name: Build
        run: python3 build.py
      - name: Tests on the device runtime
        run: |
          python3 test_package.py
          python3 test_api.py
          python3 test_filetools.py
          python3 test_upgrade.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tests-python39]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the tested artifacts
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - name: Verify the tag matches the package version
        run: |
          V=$(python3 -c "import package_lifecycle as l; print(l.VERSION)")
          case "$GITHUB_REF_NAME" in
            "v$V"|"v${V%%+*}"|"v${V%%-*}") ;;
            *) echo "tag $GITHUB_REF_NAME does not match package version $V"; exit 1 ;;
          esac
          ls -l dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME" --notes "Built from ${GITHUB_SHA}"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
